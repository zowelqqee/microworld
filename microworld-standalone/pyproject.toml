[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microworld-runtime"
version = "0.1.0"
description = "A local, explicit-memory semantic AI runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110,<1.0",
    "numpy>=1.26,<3.0",
    "pydantic>=2.0,<3.0",
    "requests>=2.31,<3.0",
    "uvicorn>=0.27,<1.0",
]

[project.scripts]
microworld = "worldpgt.experiments.ask_microworld_v1:main"
microworld-api = "worldpgt.api.server:main"

[tool.setuptools.packages.find]
include = ["worldpgt*"]

[tool.setuptools.package-data]
worldpgt = ["**/*.html", "**/*.json", "**/*.npy"]
